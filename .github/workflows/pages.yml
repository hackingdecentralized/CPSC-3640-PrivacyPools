# Builds website/ as a static export and publishes it to GitHub Pages at https://<owner>.github.io/<repo>/.
# One-time setup (see RUN.md, section B step 3): Settings -> Pages -> Source "GitHub Actions", and the repository
# variables below under Settings -> Secrets and variables -> Actions -> Variables.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: website
    env:
      # NEXT_PUBLIC_* values are baked into the public JavaScript: anyone can read them.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_IS_TESTNET: 'true'
      NEXT_PUBLIC_SEPOLIA_RPC_URL: ${{ vars.NEXT_PUBLIC_SEPOLIA_RPC_URL }}
      NEXT_PUBLIC_ASP_ENDPOINT_TEST: ${{ vars.NEXT_PUBLIC_ASP_ENDPOINT_TEST }}
      NEXT_PUBLIC_RELAYER_URL: ${{ vars.NEXT_PUBLIC_RELAYER_URL }}
      NEXT_PUBLIC_PROJECT_ID: ${{ vars.NEXT_PUBLIC_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check repository variables
        run: |
          missing=0
          for name in NEXT_PUBLIC_SEPOLIA_RPC_URL NEXT_PUBLIC_ASP_ENDPOINT_TEST NEXT_PUBLIC_RELAYER_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (Settings -> Secrets and variables -> Actions -> Variables)"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/out
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
